# Infraestrutura de desenvolvimento local.
# Em homologação e produção estes serviços vivem no EasyPanel, em projetos
# separados (`producao` e `homologacao`), com as mesmas variáveis de ambiente.
services:
  banco:
    image: postgres:16-alpine
    container_name: eferreira-banco
    restart: unless-stopped
    environment:
      POSTGRES_USER: eferreira
      POSTGRES_PASSWORD: eferreira
      POSTGRES_DB: eferreira
      TZ: America/Sao_Paulo
    ports:
      - '5432:5432'
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eferreira -d eferreira']
      interval: 10s
      timeout: 5s
      retries: 10

  armazenamento:
    image: minio/minio:latest
    container_name: eferreira-armazenamento
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eferreira
      MINIO_ROOT_PASSWORD: eferreira123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - dados-armazenamento:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  criar-balde:
    image: minio/mc:latest
    depends_on:
      armazenamento:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://armazenamento:9000 eferreira eferreira123;
      mc mb --ignore-existing local/eferreira-documentos;
      mc anonymous set none local/eferreira-documentos;
      echo 'Balde eferreira-documentos pronto e sem acesso anônimo.';
      "

volumes:
  dados-banco:
  dados-armazenamento:
