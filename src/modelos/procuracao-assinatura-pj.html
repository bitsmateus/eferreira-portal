<!--
  Assinatura da pessoa jurídica: a empresa, "Representada por" quem assina,
  como no modelo de 24/09/2026.
-->
<div class="assinatura">
  <div class="marca-de-assinatura">[[assina:parte]]</div>
  <div class="linha"></div>
  <div class="nome">{{cliente.nome}}</div>
  <div class="documento">CNPJ nº {{cliente.documentoFormatado}}</div>
  <div class="documento">Representada por: {{representante.nome}}</div>
</div>
