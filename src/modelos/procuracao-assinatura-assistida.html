<!--
  Assinatura da pessoa física representada/assistida: nome e CPF de quem
  outorga, e "Representada por" quem assiste, como no modelo de 24/09/2026.
-->
<div class="assinatura">
  <div class="linha"></div>
  <div class="nome">{{cliente.nome}}</div>
  <div class="documento">CPF nº {{cliente.documentoFormatado}}</div>
  <div class="documento">Representada por: {{representante.nome}}</div>
</div>
